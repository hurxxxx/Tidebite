services:
  ocean:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    platform: linux/amd64
    ports:
      - "7777:7777/udp"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /home/tidebite/.config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 10s
    mem_limit: 512m
    cpus: 1.0
